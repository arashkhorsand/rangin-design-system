<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><title>OtpInput</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&amp;display=swap">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../styles.css">
</head>
<body class="rg" dir="rtl">
<div class="rg-stack" style="max-width:300px">
  <span class="rg-field-label">کد تأیید پیامک‌شده به ۰۹۱۲ ۳۴۵ ۶۷۸۹</span>
  <div class="rg-otp" role="group" aria-label="کد تأیید پنج‌رقمی">
    <input id="otp-1" class="is-filled" inputmode="numeric" maxlength="1" value="۴" aria-label="رقم ۱" autocomplete="one-time-code">
    <input id="otp-2" class="is-filled" inputmode="numeric" maxlength="1" value="۷" aria-label="رقم ۲">
    <input id="otp-3" class="is-filled" inputmode="numeric" maxlength="1" value="۲" aria-label="رقم ۳">
    <input id="otp-4" inputmode="numeric" maxlength="1" aria-label="رقم ۴">
    <input id="otp-5" inputmode="numeric" maxlength="1" aria-label="رقم ۵">
  </div>
  <div class="rg-otp-meta"><span>ارسال دوباره تا <b>۰۱:۴۷</b></span><button class="rg-btn rg-btn-tint rg-btn-sm" type="button">ویرایش شماره</button></div>
</div>
<script>
  var boxes = Array.prototype.slice.call(document.querySelectorAll('.rg-otp input'));
  boxes.forEach(function (el, i) {
    el.addEventListener('input', function () {
      el.classList.toggle('is-filled', !!el.value);
      if (el.value && boxes[i + 1]) boxes[i + 1].focus();
    });
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Backspace' && !el.value && boxes[i - 1]) boxes[i - 1].focus();
    });
  });
</script>
</body>
</html>
