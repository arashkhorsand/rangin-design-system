<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><title>Button</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&amp;display=swap">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../styles.css">
</head>
<body class="rg" dir="rtl">
<div class="rg-stack">
  <div class="rg-row">
    <button class="rg-btn rg-btn-primary" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l1 12H5z"/><path d="M9 8V7a3 3 0 0 1 6 0v1"/></svg>افزودن به سبد</button>
    <button class="rg-btn rg-btn-ink" type="button">پرداخت</button>
    <button class="rg-btn rg-btn-pink" type="button">دریافت تخفیف</button>
    <button class="rg-btn rg-btn-tint" type="button">مشاهدهٔ همه<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
    <button class="rg-btn rg-btn-outline" type="button">انصراف</button>
  </div>
  <div class="rg-row">
    <button class="rg-btn rg-btn-primary rg-btn-lg" type="button">ثبت سفارش</button>
    <button class="rg-btn rg-btn-outline rg-btn-sm" type="button">ویرایش آدرس</button>
    <button class="rg-btn rg-btn-danger rg-btn-sm" type="button">حذف</button>
    <button class="rg-btn rg-btn-primary rg-btn-icon" type="button" aria-label="افزودن"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="rg-btn rg-btn-primary" type="button" disabled>ناموجود</button>
  </div>
</div>
</body>
</html>
