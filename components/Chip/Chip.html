<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><title>Chip</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&amp;display=swap">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../styles.css">
</head>
<body class="rg" dir="rtl">
<div class="rg-chips" role="group" aria-label="دسته‌بندی">
  <button class="rg-chip" type="button" aria-pressed="true">همه</button>
  <button class="rg-chip" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16a8 8 0 0 1-16 0zM12 4v4M8 5v3M16 5v3"/></svg>ایرانی</button>
  <button class="rg-chip" type="button" aria-pressed="false">فست‌فود</button>
  <button class="rg-chip" type="button" aria-pressed="false">کافه</button>
  <button class="rg-chip" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>زیر ۳۰ دقیقه</button>
  <button class="rg-chip" type="button" aria-pressed="false">ارسال رایگان</button>
</div>
<script>
  document.querySelectorAll('.rg-chip').forEach(function (c) {
    c.addEventListener('click', function () {
      document.querySelectorAll('.rg-chip').forEach(function (o) { o.setAttribute('aria-pressed', String(o === c)); });
    });
  });
</script>
</body>
</html>
