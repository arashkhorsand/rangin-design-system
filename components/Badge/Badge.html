<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><title>Badge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&amp;display=swap">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../styles.css">
</head>
<body class="rg" dir="rtl">
<div class="rg-stack">
  <div class="rg-row">
    <span class="rg-badge rg-badge-success"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>تحویل شد</span>
    <span class="rg-badge rg-badge-blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>در حال آماده‌سازی</span>
    <span class="rg-badge rg-badge-sun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v5M12 16v.5"/></svg>در انتظار پرداخت</span>
    <span class="rg-badge rg-badge-danger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v5M12 16v.5"/></svg>لغو شد</span>
    <span class="rg-badge">ناموجود</span>
  </div>
  <div class="rg-row">
    <span class="rg-badge rg-badge-brand">ارسال رایگان</span>
    <span class="rg-badge rg-badge-pink">پیشنهاد ویژه</span>
    <span class="rg-badge rg-badge-off">٪۲۵</span>
  </div>
</div>
</body>
</html>
