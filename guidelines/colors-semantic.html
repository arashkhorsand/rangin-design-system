<!-- @dsCard group="Colors" viewport="700x130" name="Semantic" subtitle="success & danger — always paired with a word or icon" -->
<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>Semantic</title><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{padding:16px;background:var(--bg);color:var(--ink);font-family:var(--font-sans);direction:rtl}.cap{font-size:12px;line-height:1.7;font-weight:500;color:var(--ink-muted)}.mono{direction:ltr;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--ink-muted)}</style></head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px"><div style="display:flex;flex-direction:column;gap:4px"><div style="height:64px;border-radius:14px;background:var(--success);border:1px solid var(--line);display:grid;place-items:center;color:var(--bg);font-weight:800;font-size:15px"></div><span style="font-size:13px;font-weight:700">success</span><span class="mono" data-v="success"></span></div><div style="display:flex;flex-direction:column;gap:4px"><div style="height:64px;border-radius:14px;background:var(--success-tint);border:1px solid var(--line);display:grid;place-items:center;color:var(--success);font-weight:800;font-size:15px"></div><span style="font-size:13px;font-weight:700">success-tint</span><span class="mono" data-v="success-tint"></span></div><div style="display:flex;flex-direction:column;gap:4px"><div style="height:64px;border-radius:14px;background:var(--danger);border:1px solid var(--line);display:grid;place-items:center;color:var(--on-danger);font-weight:800;font-size:15px"></div><span style="font-size:13px;font-weight:700">danger</span><span class="mono" data-v="danger"></span></div><div style="display:flex;flex-direction:column;gap:4px"><div style="height:64px;border-radius:14px;background:var(--danger-tint);border:1px solid var(--line);display:grid;place-items:center;color:var(--danger);font-weight:800;font-size:15px"></div><span style="font-size:13px;font-weight:700">danger-tint</span><span class="mono" data-v="danger-tint"></span></div><div style="display:flex;flex-direction:column;gap:4px"><div style="height:64px;border-radius:14px;background:var(--focus);border:1px solid var(--line);display:grid;place-items:center;color:var(--bg);font-weight:800;font-size:15px"></div><span style="font-size:13px;font-weight:700">focus</span><span class="mono" data-v="focus"></span></div></div><script>document.querySelectorAll('[data-v]').forEach(e=>e.textContent=getComputedStyle(document.documentElement).getPropertyValue('--'+e.dataset.v).trim())</script></body></html>
