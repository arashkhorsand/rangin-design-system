<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>Deep & tint</title><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{padding:16px;background:var(--bg);color:var(--ink);font-family:var(--font-sans);direction:rtl}.cap{font-size:12px;line-height:1.7;font-weight:500;color:var(--ink-muted)}.mono{direction:ltr;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--ink-muted)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px"><div style="display:flex;flex-direction:column;gap:6px"><div style="height:56px;border-radius:14px;background:var(--brand-tint);display:grid;place-items:center;color:var(--brand-deep);font-weight:800">متن brand</div><span style="font-size:13px;font-weight:700">brand-tint</span><span style="color:var(--brand-deep);font-weight:700;font-size:14px">brand-deep روی سفید</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:56px;border-radius:14px;background:var(--pink-tint);display:grid;place-items:center;color:var(--pink-deep);font-weight:800">متن pink</div><span style="font-size:13px;font-weight:700">pink-tint</span><span style="color:var(--pink-deep);font-weight:700;font-size:14px">pink-deep روی سفید</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:56px;border-radius:14px;background:var(--blue-tint);display:grid;place-items:center;color:var(--blue);font-weight:800">متن blue</div><span style="font-size:13px;font-weight:700">blue-tint</span><span style="color:var(--blue);font-weight:700;font-size:14px">blue روی سفید</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:56px;border-radius:14px;background:var(--sun-tint);display:grid;place-items:center;color:var(--sun-deep);font-weight:800">متن sun</div><span style="font-size:13px;font-weight:700">sun-tint</span><span style="color:var(--sun-deep);font-weight:700;font-size:14px">sun-deep روی سفید</span></div></div></body></html>
