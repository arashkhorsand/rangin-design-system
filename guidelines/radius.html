<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="Everything is round — no sharp corners" -->
<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>Corner radii</title><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{padding:16px;background:var(--bg);color:var(--ink);font-family:var(--font-sans);direction:rtl}.cap{font-size:12px;line-height:1.7;font-weight:500;color:var(--ink-muted)}.mono{direction:ltr;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--ink-muted)}</style></head><body><div style="display:flex;gap:16px"><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:72px;background:var(--surface);border:1.5px solid var(--line-strong);border-radius:var(--radius-sm)"></div><span style="font-size:13px;font-weight:700">radius-sm</span><span class="cap">8 · tag</span></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:72px;background:var(--surface);border:1.5px solid var(--line-strong);border-radius:var(--radius-md)"></div><span style="font-size:13px;font-weight:700">radius-md</span><span class="cap">14 · field</span></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:72px;background:var(--surface);border:1.5px solid var(--line-strong);border-radius:var(--radius-lg)"></div><span style="font-size:13px;font-weight:700">radius-lg</span><span class="cap">22 · card</span></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:72px;background:var(--surface);border:1.5px solid var(--line-strong);border-radius:var(--radius-xl)"></div><span style="font-size:13px;font-weight:700">radius-xl</span><span class="cap">32 · bento, sheet</span></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:72px;background:var(--surface);border:1.5px solid var(--line-strong);border-radius:var(--radius-pill)"></div><span style="font-size:13px;font-weight:700">radius-pill</span><span class="cap">999 · button, chip</span></div></div></body></html>
