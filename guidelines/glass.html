<style>html,body{margin:0}body{padding:16px;background:var(--bg);color:var(--ink);font-family:var(--font-sans);direction:rtl}.cap{font-size:12px;line-height:1.7;font-weight:500;color:var(--ink-muted)}.mono{direction:ltr;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--ink-muted)}body{padding:0}</style></head><body><div style="position:relative;height:150px;overflow:hidden;background:var(--surface)"><div style="position:absolute;inset:12px auto auto 40px;width:160px;height:120px;border-radius:32px;background:var(--brand)"></div><div style="position:absolute;top:30px;left:240px;width:120px;height:120px;border-radius:999px;background:var(--pink)"></div><div style="position:absolute;top:10px;left:420px;width:200px;height:96px;border-radius:22px;background:var(--sun)"></div><div style="position:absolute;inset:auto 16px 16px 16px;height:64px;border-radius:999px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(16px) saturate(1.6);-webkit-backdrop-filter:blur(16px) saturate(1.6);box-shadow:var(--shadow-card);display:grid;place-items:center;font-weight:700">--glass</div></div></body></html>
