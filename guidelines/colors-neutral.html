<!-- @dsCard group="Colors" viewport="700x130" name="Neutrals & surfaces" subtitle="bg is pure white; surface separates sections instead of lines" -->
<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>Neutrals & surfaces</title><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{padding:16px;background:var(--bg);color:var(--ink);font-family:var(--font-sans);direction:rtl}.cap{font-size:12px;line-height:1.7;font-weight:500;color:var(--ink-muted)}.mono{direction:ltr;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--ink-muted)}</style></head><body><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:10px"><div style="display:flex;flex-direction:column;gap:4px"><div style="height:64px;border-radius:14px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);font-weight:800;font-size:15px"></div><span style="font-size:13px;font-weight:700">bg</span><span class="mono" data-v="bg"></span></div><div style="display:flex;flex-direction:column;gap:4px"><div style="height:64px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);font-weight:800;font-size:15px"></div><span style="font-size:13px;font-weight:700">surface</span><span class="mono" data-v="surface"></span></div><div style="display:flex;flex-direction:column;gap:4px"><div style="height:64px;border-radius:14px;background:var(--surface-raised);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);font-weight:800;font-size:15px"></div><span style="font-size:13px;font-weight:700">surface-raised</span><span class="mono" data-v="surface-raised"></span></div><div style="display:flex;flex-direction:column;gap:4px"><div style="height:64px;border-radius:14px;background:var(--line);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);font-weight:800;font-size:15px"></div><span style="font-size:13px;font-weight:700">line</span><span class="mono" data-v="line"></span></div><div style="display:flex;flex-direction:column;gap:4px"><div style="height:64px;border-radius:14px;background:var(--line-strong);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);font-weight:800;font-size:15px"></div><span style="font-size:13px;font-weight:700">line-strong</span><span class="mono" data-v="line-strong"></span></div><div style="display:flex;flex-direction:column;gap:4px"><div style="height:64px;border-radius:14px;background:var(--ink-muted);border:1px solid var(--line);display:grid;place-items:center;color:var(--bg);font-weight:800;font-size:15px"></div><span style="font-size:13px;font-weight:700">ink-muted</span><span class="mono" data-v="ink-muted"></span></div><div style="display:flex;flex-direction:column;gap:4px"><div style="height:64px;border-radius:14px;background:var(--ink);border:1px solid var(--line);display:grid;place-items:center;color:var(--bg);font-weight:800;font-size:15px"></div><span style="font-size:13px;font-weight:700">ink</span><span class="mono" data-v="ink"></span></div></div><script>document.querySelectorAll('[data-v]').forEach(e=>e.textContent=getComputedStyle(document.documentElement).getPropertyValue('--'+e.dataset.v).trim())</script></body></html>
