<!-- @dsCard group="Colors" viewport="700x130" name="Accent fills" subtitle="Four loud fills — brand, pink, blue, sun — with on-… text" -->
<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>Accent fills</title><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{padding:16px;background:var(--bg);color:var(--ink);font-family:var(--font-sans);direction:rtl}.cap{font-size:12px;line-height:1.7;font-weight:500;color:var(--ink-muted)}.mono{direction:ltr;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--ink-muted)}</style></head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px"><div style="display:flex;flex-direction:column;gap:4px"><div style="height:64px;border-radius:14px;background:var(--brand);border:1px solid var(--line);display:grid;place-items:center;color:var(--on-brand);font-weight:800;font-size:15px">رنگین</div><span style="font-size:13px;font-weight:700">brand</span><span class="mono" data-v="brand"></span></div><div style="display:flex;flex-direction:column;gap:4px"><div style="height:64px;border-radius:14px;background:var(--pink);border:1px solid var(--line);display:grid;place-items:center;color:var(--on-pink);font-weight:800;font-size:15px">٪۴۰</div><span style="font-size:13px;font-weight:700">pink</span><span class="mono" data-v="pink"></span></div><div style="display:flex;flex-direction:column;gap:4px"><div style="height:64px;border-radius:14px;background:var(--blue);border:1px solid var(--line);display:grid;place-items:center;color:var(--on-blue);font-weight:800;font-size:15px">اطلاع</div><span style="font-size:13px;font-weight:700">blue</span><span class="mono" data-v="blue"></span></div><div style="display:flex;flex-direction:column;gap:4px"><div style="height:64px;border-radius:14px;background:var(--sun);border:1px solid var(--line);display:grid;place-items:center;color:var(--on-sun);font-weight:800;font-size:15px">★ ۴٫۷</div><span style="font-size:13px;font-weight:700">sun</span><span class="mono" data-v="sun"></span></div><div style="display:flex;flex-direction:column;gap:4px"><div style="height:64px;border-radius:14px;background:var(--ink);border:1px solid var(--line);display:grid;place-items:center;color:var(--on-ink);font-weight:800;font-size:15px">پرداخت</div><span style="font-size:13px;font-weight:700">ink</span><span class="mono" data-v="ink"></span></div></div><script>document.querySelectorAll('[data-v]').forEach(e=>e.textContent=getComputedStyle(document.documentElement).getPropertyValue('--'+e.dataset.v).trim())</script></body></html>
