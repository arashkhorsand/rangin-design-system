<!-- @dsCard group="Spacing" viewport="700x170" name="Shadows & glow" subtitle="Shadow only on floating card/nav, sheet, and primary-button glow" -->
<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>Shadows & glow</title><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{padding:16px;background:var(--bg);color:var(--ink);font-family:var(--font-sans);direction:rtl}.cap{font-size:12px;line-height:1.7;font-weight:500;color:var(--ink-muted)}.mono{direction:ltr;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--ink-muted)}body{background:var(--surface)}</style></head><body><div style="display:flex;gap:20px;padding:8px"><div style="flex:1;display:flex;flex-direction:column;gap:10px"><div style="height:72px;background:var(--surface-raised);border-radius:22px;box-shadow:var(--shadow-card)"></div><span style="font-size:13px;font-weight:700">shadow-card</span></div><div style="flex:1;display:flex;flex-direction:column;gap:10px"><div style="height:72px;background:var(--surface-raised);border-radius:32px 32px 0 0;box-shadow:var(--shadow-sheet)"></div><span style="font-size:13px;font-weight:700">shadow-sheet</span></div><div style="flex:1;display:flex;flex-direction:column;gap:10px"><div style="height:72px;background:var(--brand);border-radius:999px;box-shadow:var(--glow-brand)"></div><span style="font-size:13px;font-weight:700">glow-brand</span></div><div style="flex:1;display:flex;flex-direction:column;gap:10px"><div style="height:72px;background:var(--pink);border-radius:999px;box-shadow:var(--glow-pink)"></div><span style="font-size:13px;font-weight:700">glow-pink</span></div></div></body></html>
