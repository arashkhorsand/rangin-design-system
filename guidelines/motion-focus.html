<!-- @dsCard group="Spacing" viewport="700x140" name="Motion & focus" subtitle="120–200ms; press scale(.97); 2px focus ring, 2px offset" -->
<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>Motion & focus</title><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{padding:16px;background:var(--bg);color:var(--ink);font-family:var(--font-sans);direction:rtl}.cap{font-size:12px;line-height:1.7;font-weight:500;color:var(--ink-muted)}.mono{direction:ltr;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--ink-muted)}</style></head><body><div style="display:flex;gap:24px;align-items:center"><button style="height:48px;padding:0 24px;border:0;border-radius:999px;background:var(--brand);color:var(--on-brand);font:inherit;font-weight:700;box-shadow:var(--glow-brand);transition:transform .12s ease;cursor:pointer" onmousedown="this.style.transform='scale(.97)'" onmouseup="this.style.transform=''" onmouseleave="this.style.transform=''">فشار دهید</button><button style="height:48px;padding:0 24px;border:1.5px solid var(--line-strong);border-radius:999px;background:var(--bg);font:inherit;font-weight:700;outline:2px solid var(--focus);outline-offset:2px">حلقهٔ فوکوس</button><div class="cap" style="direction:ltr">transform .12s ease · box-shadow/background .2s ease<br>prefers-reduced-motion → none</div></div></body></html>
