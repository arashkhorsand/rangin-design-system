<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>Dark theme</title><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{padding:16px;background:var(--bg);color:var(--ink);font-family:var(--font-sans);direction:rtl}.cap{font-size:12px;line-height:1.7;font-weight:500;color:var(--ink-muted)}.mono{direction:ltr;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--ink-muted)}</style></head><body><div data-theme="dark" style="background:var(--bg);border-radius:22px;padding:16px;display:grid;grid-template-columns:repeat(8,1fr);gap:8px"><div style="display:flex;flex-direction:column;gap:2px"><div style="height:32px;border-radius:8px;background:var(--bg);border:1px solid var(--line)"></div><span style="font-size:11px;color:var(--ink-muted);direction:ltr;text-align:right">bg</span></div><div style="display:flex;flex-direction:column;gap:2px"><div style="height:32px;border-radius:8px;background:var(--surface);border:1px solid var(--line)"></div><span style="font-size:11px;color:var(--ink-muted);direction:ltr;text-align:right">surface</span></div><div style="display:flex;flex-direction:column;gap:2px"><div style="height:32px;border-radius:8px;background:var(--surface-raised);border:1px solid var(--line)"></div><span style="font-size:11px;color:var(--ink-muted);direction:ltr;text-align:right">surface-raised</span></div><div style="display:flex;flex-direction:column;gap:2px"><div style="height:32px;border-radius:8px;background:var(--line);border:1px solid var(--line)"></div><span style="font-size:11px;color:var(--ink-muted);direction:ltr;text-align:right">line</span></div><div style="display:flex;flex-direction:column;gap:2px"><div style="height:32px;border-radius:8px;background:var(--ink);border:1px solid var(--line)"></div><span style="font-size:11px;color:var(--ink-muted);direction:ltr;text-align:right">ink</span></div><div style="display:flex;flex-direction:column;gap:2px"><div style="height:32px;border-radius:8px;background:var(--brand);border:1px solid var(--line)"></div><span style="font-size:11px;color:var(--ink-muted);direction:ltr;text-align:right">brand</span></div><div style="display:flex;flex-direction:column;gap:2px"><div style="height:32px;border-radius:8px;background:var(--brand-deep);border:1px solid var(--line)"></div><span style="font-size:11px;color:var(--ink-muted);direction:ltr;text-align:right">brand-deep</span></div><div style="display:flex;flex-direction:column;gap:2px"><div style="height:32px;border-radius:8px;background:var(--pink);border:1px solid var(--line)"></div><span style="font-size:11px;color:var(--ink-muted);direction:ltr;text-align:right">pink</span></div><div style="display:flex;flex-direction:column;gap:2px"><div style="height:32px;border-radius:8px;background:var(--pink-deep);border:1px solid var(--line)"></div><span style="font-size:11px;color:var(--ink-muted);direction:ltr;text-align:right">pink-deep</span></div><div style="display:flex;flex-direction:column;gap:2px"><div style="height:32px;border-radius:8px;background:var(--blue);border:1px solid var(--line)"></div><span style="font-size:11px;color:var(--ink-muted);direction:ltr;text-align:right">blue</span></div><div style="display:flex;flex-direction:column;gap:2px"><div style="height:32px;border-radius:8px;background:var(--sun);border:1px solid var(--line)"></div><span style="font-size:11px;color:var(--ink-muted);direction:ltr;text-align:right">sun</span></div><div style="display:flex;flex-direction:column;gap:2px"><div style="height:32px;border-radius:8px;background:var(--success);border:1px solid var(--line)"></div><span style="font-size:11px;color:var(--ink-muted);direction:ltr;text-align:right">success</span></div><div style="display:flex;flex-direction:column;gap:2px"><div style="height:32px;border-radius:8px;background:var(--danger);border:1px solid var(--line)"></div><span style="font-size:11px;color:var(--ink-muted);direction:ltr;text-align:right">danger</span></div><div style="display:flex;flex-direction:column;gap:2px"><div style="height:32px;border-radius:8px;background:var(--brand-tint);border:1px solid var(--line)"></div><span style="font-size:11px;color:var(--ink-muted);direction:ltr;text-align:right">brand-tint</span></div><div style="display:flex;flex-direction:column;gap:2px"><div style="height:32px;border-radius:8px;background:var(--pink-tint);border:1px solid var(--line)"></div><span style="font-size:11px;color:var(--ink-muted);direction:ltr;text-align:right">pink-tint</span></div><div style="display:flex;flex-direction:column;gap:2px"><div style="height:32px;border-radius:8px;background:var(--blue-tint);border:1px solid var(--line)"></div><span style="font-size:11px;color:var(--ink-muted);direction:ltr;text-align:right">blue-tint</span></div></div></body></html>
