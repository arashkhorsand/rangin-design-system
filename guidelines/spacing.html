<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="space-1 → space-8; gutter space-4, touch target space-7" -->
<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>Spacing scale</title><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{padding:16px;background:var(--bg);color:var(--ink);font-family:var(--font-sans);direction:rtl}.cap{font-size:12px;line-height:1.7;font-weight:500;color:var(--ink-muted)}.mono{direction:ltr;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--ink-muted)}</style></head><body><div style="display:flex;align-items:flex-end;gap:18px"><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-1);height:var(--space-1);background:var(--brand);border-radius:4px"></div><span class="mono">space-1</span><span class="mono" data-v="space-1"></span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-2);height:var(--space-2);background:var(--brand);border-radius:4px"></div><span class="mono">space-2</span><span class="mono" data-v="space-2"></span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-3);height:var(--space-3);background:var(--brand);border-radius:4px"></div><span class="mono">space-3</span><span class="mono" data-v="space-3"></span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-4);height:var(--space-4);background:var(--brand);border-radius:4px"></div><span class="mono">space-4</span><span class="mono" data-v="space-4"></span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-5);height:var(--space-5);background:var(--brand);border-radius:4px"></div><span class="mono">space-5</span><span class="mono" data-v="space-5"></span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-6);height:var(--space-6);background:var(--brand);border-radius:4px"></div><span class="mono">space-6</span><span class="mono" data-v="space-6"></span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-7);height:var(--space-7);background:var(--brand);border-radius:4px"></div><span class="mono">space-7</span><span class="mono" data-v="space-7"></span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-8);height:var(--space-8);background:var(--brand);border-radius:4px"></div><span class="mono">space-8</span><span class="mono" data-v="space-8"></span></div></div><script>document.querySelectorAll('[data-v]').forEach(e=>e.textContent=getComputedStyle(document.documentElement).getPropertyValue('--'+e.dataset.v).trim())</script></body></html>
