<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>States</title><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}.g{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;align-items:center;justify-items:center}.c{font-size:12px;font-weight:500;color:var(--ink-muted)}</style></head>
<body class="rg" dir="rtl"><div class="g">
<span class="c">پیش‌فرض</span><span class="c">هاور</span><span class="c">فشار</span><span class="c">فوکوس</span><span class="c">غیرفعال</span>
<button class="rg-btn rg-btn-primary">پرداخت</button><button class="rg-btn rg-btn-primary" style="filter:brightness(.95)">پرداخت</button><button class="rg-btn rg-btn-primary" style="transform:scale(.97)">پرداخت</button><button class="rg-btn rg-btn-primary" style="outline:2px solid var(--focus);outline-offset:2px">پرداخت</button><button class="rg-btn rg-btn-primary" disabled>پرداخت</button>
<button class="rg-chip" aria-pressed="false">کافه</button><button class="rg-chip" aria-pressed="false" style="border-color:var(--ink)">کافه</button><button class="rg-chip" aria-pressed="true" style="transform:scale(.97)">کافه</button><button class="rg-chip" aria-pressed="false" style="outline:2px solid var(--focus);outline-offset:2px">کافه</button><button class="rg-chip" aria-pressed="false" disabled style="color:var(--ink-muted);border-color:var(--line)">کافه</button>
</div></body></html>
