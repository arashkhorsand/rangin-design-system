<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>Persian text rules</title><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{padding:16px;background:var(--bg);color:var(--ink);font-family:var(--font-sans);direction:rtl}.cap{font-size:12px;line-height:1.7;font-weight:500;color:var(--ink-muted)}.mono{direction:ltr;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--ink-muted)}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:14px;background:var(--surface)"><b style="font-size:17px;font-weight:800">۱۲۸٬۰۰۰ <small style="font-size:11px;font-weight:500;color:var(--ink-muted)">تومان</small></b><span style="color:var(--danger);font-size:13px;text-decoration:line-through">128,000 Toman</span></div><div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:14px;background:var(--surface)"><b style="font-size:17px;font-weight:800">٪۲۰</b><span style="color:var(--danger);font-size:13px;text-decoration:line-through">20%</span></div><div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:14px;background:var(--surface)"><b style="font-size:17px;font-weight:800">۱۴ مهر ۱۴۰۵ · ۱۸:۳۰</b><span style="color:var(--danger);font-size:13px;text-decoration:line-through">6 Oct 2026 · 6:30 PM</span></div><div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:14px;background:var(--surface)"><b style="font-size:17px;font-weight:800">می‌شود · سفارش‌ها</b><span style="color:var(--danger);font-size:13px;text-decoration:line-through">میشود · سفارش ها</span></div></div></body></html>
